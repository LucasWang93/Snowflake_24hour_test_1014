# Template only. Run on one approved persistent Docker host, never the Slurm login node.
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    stop_grace_period: 70s
    init: true
    env_file:
      - ${CENSUS_SERVER_ENV_FILE:?Set the absolute owner-only server env file path}
    environment:
      CENSUS_CONTROL_PATH: /var/lib/census/control.sqlite
      SNOWFLAKE_PRIVATE_KEY_FILE: /run/secrets/snowflake.p8
      STREAMLIT_BROWSER_SERVER_ADDRESS: ${CENSUS_DOMAIN:?Set DNS hostname pointed at this host}
      STREAMLIT_BROWSER_SERVER_PORT: "443"
    volumes:
      - census_control:/var/lib/census
      - type: bind
        source: ${CENSUS_PRIVATE_KEY_FILE:?Set the absolute owner-only server key path}
        target: /run/secrets/snowflake.p8
        read_only: true
    expose:
      - "8501"
    pids_limit: 64
    mem_limit: 2g
    cpus: 2
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      CENSUS_DOMAIN: ${CENSUS_DOMAIN:?Set DNS hostname pointed at this host}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  census_control:
  caddy_data:
  caddy_config:
